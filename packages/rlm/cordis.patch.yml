# Direct headless composition: preserve the existing runner, model route and tools.
# Prime owns the model-facing repl; its cells call the existing host tools.
- id: tools
  config:
    mode: native

- insert:
    - id: harness-rlm-runtime
      name: ./runtime.mjs
      config:
        stateDirectory: !!js dshHomePath('agent-harness-plugin', 'rlm')
        # Upstream defaults to 64 MiB; heap exhaustion restarts the Realm and loses every binding.
        maxOldGenerationSizeMb: 512

    - id: harness-rlm
      name: ./index.mjs
      config:
        stateDirectory: !!js dshHomePath('agent-harness-plugin', 'rlm')
        requireOrchestrationTools: true
        allowGlobalRefinement: false

    # Prime always registers apply_patch; host edit/write already cover file changes.
    - id: harness-rlm-tool-restrictions
      name: ./tool-restrictions.mjs
      config:
        deny:
          - apply_patch

# Deliberately omit dsh-prime-agent/context-manager and its Prime preset.
# With CLM enabled, CLM owns context replacement; RLM only owns live variables.
